name: install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck -x -e SC1091 -s bash install.sh unlink.sh lib/*.sh profiles/*.sh \
            modules/*/module.sh modules/*/rc.d/*.sh modules/bash/bashrc

  ubuntu:
    runs-on: ubuntu-24.04
    env:
      # mise downloads from GitHub; unauthenticated requests get rate limited.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: ./install.sh container
      - name: Install again
        run: ./install.sh container
      - name: Check tools from a login shell
        run: bash -lc 'nvim --version && node --version && lazygit --version && just --version'
      - name: Check Neovim loads its config
        run: bash -lc 'nvim --headless +qa'
      - name: Check links for the other profiles
        run: |
          for profile in workstation server; do
            HOME="$(mktemp -d)" ./install.sh "$profile" --link-only
          done
      - name: Check links can be undone
        run: |
          export HOME="$(mktemp -d)"
          echo original > "$HOME/.bashrc"
          ./install.sh container --link-only
          ./unlink.sh
          test "$(cat "$HOME/.bashrc")" = original
          test -z "$(find "$HOME" -type l)"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with the system Bash
        run: |
          export HOME="$(mktemp -d)"
          /bin/bash ./install.sh mac --link-only
          /bin/bash ./unlink.sh
          test -z "$(find "$HOME" -type l)"
